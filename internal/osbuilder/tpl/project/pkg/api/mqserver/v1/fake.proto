// Healthz API definition, which includes health check response messages and status.
syntax = "proto3"; // Specifies the syntax version used by this file.

package {{.MQ.Name}}.{{.M.APIVersion}};

option go_package = "{{.M.ModuleName}}/pkg/api/{{.MQ.Name}}/{{.M.APIVersion}};{{.M.APIVersion}}";

// FakeData represents a mock entity with diverse fields for testing.
message FakeData {
  string ID = 1;
  string name = 2;
  string category = 3;
  string description = 4;
  string status = 5;
  
  // Maps to float64 in Go
  double score = 7;
}
